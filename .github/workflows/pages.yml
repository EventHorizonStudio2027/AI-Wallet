name: Deploy DomAIn website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify website build
        shell: bash
        run: |
          set -euo pipefail
          test -s AI_Wallet_Project/index.html
          test -s AI_Wallet_Project/styles/app.css
          test -s AI_Wallet_Project/src/app.js
          test -s AI_Wallet_Project/service-worker.js
          grep -q 'DomAIn' AI_Wallet_Project/index.html
          mkdir -p AI_Wallet_Project
          touch AI_Wallet_Project/.nojekyll
          echo "Deploying DomAIn from $(git rev-parse --short HEAD)"
      - name: Install Node.js for release checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit and test release before publishing
        shell: bash
        working-directory: AI_Wallet_Project
        run: |
          set -euo pipefail
          python3 tests/check_project.py
          python3 -m json.tool manifest.webmanifest >/dev/null
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check service-worker.js
          for test in tests/*.test.cjs; do
            echo "Running $test"
            node "$test"
          done
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload DomAIn app as website root
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./AI_Wallet_Project
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed website responds
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          curl --fail --location --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 "${PAGE_URL%/}/index.html" -o /tmp/domain-live.html
          grep -q 'DomAIn' /tmp/domain-live.html
