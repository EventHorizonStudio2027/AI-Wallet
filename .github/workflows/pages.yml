name: Deploy domAIn website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify website build
        shell: bash
        run: |
          set -euo pipefail
          test -s AI_Wallet_Project/index.html
          test -s AI_Wallet_Project/styles/app.css
          test -s AI_Wallet_Project/src/app.js
          test -s AI_Wallet_Project/service-worker.js
          grep -q 'domAIn' AI_Wallet_Project/index.html
          mkdir -p AI_Wallet_Project
          touch AI_Wallet_Project/.nojekyll
          echo "Deploying domAIn from $(git rev-parse --short HEAD)"
      - name: Install Node.js for release checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit and test release before publishing
        shell: bash
        working-directory: AI_Wallet_Project
        run: |
          set -euo pipefail
          python3 tests/check_project.py
          python3 -m json.tool manifest.webmanifest >/dev/null
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check service-worker.js
          for test in tests/*.test.cjs; do
            echo "Running $test"
            node "$test"
          done
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload domAIn app as website root
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./AI_Wallet_Project
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
      - name: Verify deployed website responds
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          assets=(index.html apple-touch-icon.png manifest.webmanifest src/app.js styles/app.css service-worker.js)
          for attempt in {1..6}; do
            matched=true
            for asset in "${assets[@]}"; do
              if ! curl --fail --location --silent --show-error --max-time 10 \
                "${PAGE_URL%/}/${asset}?release=${GITHUB_SHA}&attempt=${attempt}" -o /tmp/domain-live-asset ||
                 ! cmp -s "AI_Wallet_Project/${asset}" /tmp/domain-live-asset; then
                echo "Live asset pending: ${asset}"
                matched=false
              fi
            done
            if [[ "$matched" == true ]]; then
              echo "Verified live domAIn assets match ${GITHUB_SHA}."
              exit 0
            fi
            if [[ "$attempt" -lt 6 ]]; then sleep 5; fi
          done
          exit 1
