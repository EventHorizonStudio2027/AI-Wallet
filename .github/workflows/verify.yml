name: DomAIn pull request verification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate application and run regression tests
        working-directory: AI_Wallet_Project
        run: |
          set -euo pipefail
          python3 tests/check_project.py
          python3 -m json.tool manifest.webmanifest >/dev/null
          find src -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check service-worker.js
          for test in tests/*.test.cjs; do
            echo "Running $test"
            node "$test"
          done
